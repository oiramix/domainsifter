name: Daily Domain Diff

on:
  schedule:
    # Off-peak time to reduce GitHub Actions free-tier queue delay.
    # 0 6 * * * was the most popular cron minute on GitHub globally — every
    # daily report job in the world fires at the top of the hour and the
    # queue piles up. 05:17 UTC is well off any common round-number minute.
    # 05:17 UTC = 08:17 Tallinn time. Adjust if local schedule shifts.
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-diff
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DomainSifter pipeline
        env:
          CZDS_USERNAME: ${{ secrets.CZDS_USERNAME }}
          CZDS_PASSWORD: ${{ secrets.CZDS_PASSWORD }}
          OPENPAGERANK_KEY: ${{ secrets.OPENPAGERANK_KEY }}
          SAFE_BROWSING_KEY: ${{ secrets.SAFE_BROWSING_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m scripts.pipeline --config scripts/config.json

      - name: Commit refreshed daily output
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # State files (yesterday snapshots) live in Cloudflare R2 — they
          # are NOT committed to the repo. Per-TLD .org alone exceeds 200 MB
          # and blew past GitHub's 100 MB per-file limit on first run.
          git add src/data/daily-domains.json

          if git diff --cached --quiet; then
            echo "No changes to commit (daily output unchanged)."
            exit 0
          fi

          TODAY="$(date -u +%Y-%m-%d)"
          git commit -m "data: daily refresh ${TODAY}"
          git push
