# CRON MIGRATED TO OVH SYSTEMD ON 2026-05-11.
# The daily 06:30 UTC run is now driven by systemd/domainsifter.timer on
# the OVH self-hosted server (Debian 12, 128 GB RAM). This workflow is
# retained ONLY as a manual fallback — invoke via the GitHub UI's "Run
# workflow" button if the OVH run fails and an emergency rebuild on
# GitHub-hosted infrastructure is needed. CAVEAT: GHA's 16 GB RAM ceiling
# cannot parse .com (~15.5 GB peak; see 2026-05-10 STATE.md entry). If
# falling back to GHA, .com must be reverted to tlds.pending in config.json
# first or the run will OOM at ~6m54s.

name: Daily Domain Diff

on:
  # Historically triggered by the Cloudflare Worker domainsifter-cron-trigger
  # (which dispatched this workflow via the GitHub API). AS OF 2026-05-11
  # THAT WORKER IS DISABLED — workflow_dispatch is now the only active
  # trigger. Do not re-enable the Worker without first disabling the OVH
  # systemd timer, or both schedulers will race and one push will be
  # rejected.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-diff
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DomainSifter pipeline
        env:
          CZDS_USERNAME: ${{ secrets.CZDS_USERNAME }}
          CZDS_PASSWORD: ${{ secrets.CZDS_PASSWORD }}
          OPENPAGERANK_KEY: ${{ secrets.OPENPAGERANK_KEY }}
          SAFE_BROWSING_KEY: ${{ secrets.SAFE_BROWSING_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m scripts.pipeline --config scripts/config.json

      - name: Commit refreshed daily output
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # State files (yesterday snapshots) live in Cloudflare R2 — they
          # are NOT committed to the repo. Per-TLD .org alone exceeds 200 MB
          # and blew past GitHub's 100 MB per-file limit on first run.
          git add src/data/daily-domains.json

          if git diff --cached --quiet; then
            echo "No changes to commit (daily output unchanged)."
            exit 0
          fi

          TODAY="$(date -u +%Y-%m-%d)"
          git commit -m "data: daily refresh ${TODAY}"
          git push
