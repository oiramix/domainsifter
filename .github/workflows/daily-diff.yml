name: Daily Domain Diff

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-diff
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DomainSifter pipeline
        env:
          CZDS_USERNAME: ${{ secrets.CZDS_USERNAME }}
          CZDS_PASSWORD: ${{ secrets.CZDS_PASSWORD }}
          OPENPAGERANK_KEY: ${{ secrets.OPENPAGERANK_KEY }}
          SAFE_BROWSING_KEY: ${{ secrets.SAFE_BROWSING_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m scripts.pipeline --config scripts/config.json

      - name: Commit refreshed state and output
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scripts/state src/data/daily-domains.json

          if git diff --cached --quiet; then
            echo "No changes to commit (zone diffs and output unchanged)."
            exit 0
          fi

          TODAY="$(date -u +%Y-%m-%d)"
          git commit -m "data: daily refresh ${TODAY}"
          git push
